name: iPhoneDigger
options:
  bundleIdPrefix: dev.iphonedigger
  deploymentTarget:
    macOS: "14.0"
targets:
  iPhoneDigger:
    type: application
    platform: macOS
    sources:
      - path: iPhoneDigger
      - path: agent/agent.py
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: iPhone Digger
        PRODUCT_BUNDLE_IDENTIFIER: dev.iphonedigger.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iPhone Digger
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # The app spawns a Python helper and talks to usbmuxd, which the App Sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
